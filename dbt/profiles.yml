# Paths are relative to the repo root: run dbt from there (.\tasks.ps1 build).
metro_housing:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DUCKDB_PATH lets tests/test_dbt_quality.py point dbt at a throwaway fixture database.
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      extensions: [excel, spatial]
