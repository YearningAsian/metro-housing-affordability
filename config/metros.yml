# Study metros. CBSA codes follow the July 2023 Census delineation (checked by the dim_metro tests in Phase 3).
# zillow_region_id: Zillow's metro RegionID (its metro files carry no CBSA code).
# redfin_table_ids: Redfin metro keys; Dallas-Fort Worth and Seattle come split into metro divisions.
# fred_unemployment_series: FRED's monthly, not seasonally adjusted MSA unemployment rate (BLS LAUS).
# hud_fmr_areas: HUD FMR areas in the metro (fmr/listMetroAreas codes starting METRO + cbsa_code),
#   including the single-county areas HUD splits off.
metros:
