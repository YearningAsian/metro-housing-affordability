# Lint and tests on every push and pull request; no secrets, no data (the tests build their own fixtures).
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --python 3.12 --group ml --group dev --group app
      - run: uv run dbt deps --project-dir dbt --profiles-dir dbt
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest -q
