[project]
name = "metro-housing-affordability"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "pyyaml>=6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "sqlfluff>=4.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
